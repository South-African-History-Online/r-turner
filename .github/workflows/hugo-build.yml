name: Hugo build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.170.1'
          extended: true
      - name: Build
        run: cd hugo-site && hugo --minify --panicOnWarning
      - name: Check internal links and images
        run: python3 scripts/check_links.py hugo-site/public
